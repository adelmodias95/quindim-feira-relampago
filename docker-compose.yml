services:
  mongo:
    image: mongo:8.2
    ports:
      - "27017:27017"
    volumes:
      - db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: ".env"
    depends_on:
      mongo:
        condition: "service_healthy"

volumes:
  db:
